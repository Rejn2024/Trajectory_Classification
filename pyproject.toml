[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bvr-behavior-prediction"
version = "0.1.0"
description = "Causal manoeuvre recognition and forecasting pipeline for BVR Sim"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2", "pyarrow>=14.0.1", "PyYAML>=6"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3", "torch>=2.1", "matplotlib>=3.7", "mlflow>=2.9", "tqdm>=4.66"]
dev = ["pytest>=7", "ruff>=0.5"]
video = [
    "jsbsim>=1.2.0", "jupyterlab>=4", "ipykernel>=6", "matplotlib>=3.7",
    "loky>=3.4", "numpy>=1.24", "pandas>=2", "pillow>=10",
]

[project.scripts]
bvr-build-dataset = "bvr_behavior_prediction.generation.dataset_builder:main"

[tool.setuptools.packages.find]
where = [".", "bvr_sim_source"]
include = ["bvr_behavior_prediction*", "bvr_sim", "bvr_sim.agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["bvr_sim_source"]

[tool.ruff]
line-length = 100
