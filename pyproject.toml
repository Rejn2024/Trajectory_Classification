[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bvr-behavior-prediction"
version = "0.1.0"
description = "Causal manoeuvre recognition and forecasting pipeline for BVR Sim"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2", "pyarrow>=14", "PyYAML>=6"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3", "torch>=2.1", "matplotlib>=3.7"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
bvr-build-dataset = "bvr_behavior_prediction.generation.dataset_builder:main"

[tool.setuptools.packages.find]
include = ["bvr_behavior_prediction*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

